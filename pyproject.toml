[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "decoder-confidence"
version = "0.1.0"
description = "Simulation pipeline for decoder confidence evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"stim>=1.12",
	"polars>=0.20",
	"pyyaml>=6.0",
	"beliefmatching",
	"scipy>=1.10",
]

[project.optional-dependencies]
ilp = [
	"gurobipy",
	"ilp-decoder @ git+https://github.com/AKTKN/ILP-decoder.git@308d41ea0db1625e3070ff4577d67b9c19e5a03f",
]
mwpm = [
	"pymatching",
]
bplsd = [
	"ldpc",
]
relay = [
	"relay-bp @ git+https://github.com/trmue/relay.git@v0.2.2",
]
analysis = [
	"matplotlib",
	"statsmodels",
]
test = [
	"pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
	"e2e: end-to-end tests",
	"gurobi: calls the real Gurobi API; requires RUN_GUROBI_TESTS=1 (see tests/conftest.py)",
]
