# Reproduction of Wills, Yoder & Chuang, "Forced Gap Post-Selection for
# Quantum LDPC Codes and their Operations" (arXiv:2605.20346), Figure 2(a):
# idling [[72, 12, 6]] bivariate bicycle code, 6 rounds, p = 1e-3.
#
# decoder_options below are the baseline-run Relay-BP settings from
# Appendix A's left-hand table (common across all circuits they test) plus
# the right-hand table's gamma_dist_interval row for "72-Qubit Code Idling".
# metric_options.forced_num_sets overrides num_sets (R) for the K forced
# runs only, per Appendix A's differentiated baseline/forced num_sets
# (1201 vs 25) -- everything else (gamma0, gamma_dist_interval, pre_iter,
# set_max_iter, stop_nconv, seed) is shared between baseline and forced
# runs, matching the paper.
#
# Reusing this config for a different circuit from Appendix A only
# requires changing gamma_dist_interval:
#   144-Qubit Code Idling:  [-0.24, 0.66]
#   In-Module X1:           [-0.16, 0.60]
#   In-Module Y1:           [-0.14, 0.66]
#   Inter-Module X1X1:      [-0.14, 0.70]
#
# See src/decoder_confidence/decoding/_wills_reproduce.py for the algorithm
# (Phase 1-3 of the paper's Fig. 1) and its one known simplification
# (Lambda is built from one best-of-its-legs candidate per baseline/forced
# call, rather than every converged leg of every call -- see that module's
# docstring).

decoder: relay-bp
metric: wills_reproduce

decoder_options:
  gamma0: 0.1
  gamma_dist_interval: [-0.19, 0.26]  # 72-Qubit Code Idling, Appendix A
  pre_iter: 80
  set_max_iter: 60
  num_sets: 1201       # R for the baseline run only (Appendix A: "num_sets (baseline run)")
  stop_nconv: 100
  seed: 0

metric_options:
  forced_num_sets: 25  # R for each of the K forced runs (Appendix A: "num_sets (forced runs)")
  get_detail_stat: true
